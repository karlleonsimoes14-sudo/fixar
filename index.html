<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fixar · Central de Operações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;--bg-2:#101012;--surface:#151517;--surface-2:#1c1c1f;--surface-3:#26262a;
  --border:#2a2a2e;--border-2:#3a3a40;--ink:#f4f4f5;--ink-2:#b4b4bb;--muted:#7c7c85;
  --marca:#C2231D;--marca-2:#e0362f;--accent:#3987e5;
  --good:#22b07d;--warn:#e0a21b;--crit:#e5484d;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#9085e9;
  --r:14px;--r-sm:9px;--shadow:0 12px 40px rgba(0,0,0,.45);
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 11px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
select option{background:#1b1b1b;color:#f2f2f2}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-2);margin:0 0 6px}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:36px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface-2);font-weight:600;font-size:13px;white-space:nowrap;transition:.15s}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff}
.btn.pri:hover{background:var(--marca-2)}
.btn.blue{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.ic{width:18px;height:18px;flex:none}

/* ---------------- abertura ---------------- */
#intro{position:fixed;inset:0;z-index:100;background:#060606;display:grid;place-items:center;overflow:hidden;transition:opacity .6s ease,visibility .6s}
#intro.fora{opacity:0;visibility:hidden}
#intro .riscos{position:absolute;inset:0;pointer-events:none}
#intro .riscos i{position:absolute;left:-60%;height:3px;width:60%;background:linear-gradient(90deg,transparent,var(--marca),transparent);opacity:.0;animation:risco 1.6s cubic-bezier(.2,.7,.2,1) forwards}
#intro .riscos i:nth-child(1){top:38%;animation-delay:.1s}
#intro .riscos i:nth-child(2){top:44%;animation-delay:.25s;height:2px}
#intro .riscos i:nth-child(3){top:61%;animation-delay:.4s;height:2px}
#intro .riscos i:nth-child(4){top:66%;animation-delay:.55s}
@keyframes risco{0%{transform:translateX(0);opacity:0}25%{opacity:.9}100%{transform:translateX(280%);opacity:0}}
#intro .centro{position:relative;display:grid;justify-items:center;gap:18px}
#intro .tile{width:132px;height:132px;border-radius:30px;background:#fff;display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:0 0 0 0 rgba(194,35,29,.0);animation:tileIn 1.1s cubic-bezier(.2,.9,.25,1.25) .35s both,pulso 1.8s ease 1.4s}
#intro .tile img{width:112px;height:112px;animation:imgIn .9s ease .55s both}
#intro .tile::after{content:"";position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.85) 50%,transparent 60%);transform:translateX(-120%);animation:brilho 1.1s ease 1.25s forwards}
@keyframes tileIn{0%{transform:scale(.2) rotate(-14deg);opacity:0;filter:blur(8px)}100%{transform:none;opacity:1;filter:none}}
@keyframes imgIn{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes brilho{to{transform:translateX(120%)}}
@keyframes pulso{0%{box-shadow:0 0 0 0 rgba(194,35,29,.55)}100%{box-shadow:0 0 0 38px rgba(194,35,29,0)}}
#intro .nome{display:flex;gap:2px;font-weight:800;font-size:22px;letter-spacing:4px}
#intro .nome span{display:inline-block;opacity:0;transform:translateY(14px);animation:letra .5s ease forwards}
@keyframes letra{to{opacity:1;transform:none}}
#intro .barra{width:150px;height:3px;border-radius:3px;background:#222;overflow:hidden}
#intro .barra i{display:block;height:100%;width:0;background:var(--marca);animation:carrega 1.7s ease .4s forwards}
@keyframes carrega{to{width:100%}}
#intro .pular{position:absolute;bottom:22px;right:22px;font-size:11px;color:#666;background:none;border:0;letter-spacing:.5px}

/* ---------------- login ---------------- */
#login{min-height:100vh;display:grid;place-items:center;padding:28px 16px;position:relative;overflow:hidden}
.fundo{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.fundo .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.38}
.fundo .o1{width:520px;height:520px;background:radial-gradient(circle,#7d1612,transparent 65%);top:-160px;left:-120px;animation:flut 16s ease-in-out infinite alternate}
.fundo .o2{width:440px;height:440px;background:radial-gradient(circle,#3a0d0b,transparent 65%);bottom:-140px;right:-100px;animation:flut 19s ease-in-out infinite alternate-reverse}
.fundo .grade{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at 50% 40%,#000 0,transparent 70%)}
@keyframes flut{to{transform:translate(90px,60px) scale(1.12)}}
.card-login{position:relative;z-index:1;width:100%;max-width:440px;background:rgba(21,21,23,.88);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:20px;padding:30px;box-shadow:var(--shadow);overflow:hidden;animation:sobe .7s cubic-bezier(.2,.8,.2,1) both}
.card-login::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,var(--marca),#ff6a3d,var(--marca));background-size:200% 100%;animation:fluxo 4s linear infinite}
@keyframes fluxo{to{background-position:200% 0}}
@keyframes sobe{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
.marca{display:flex;align-items:center;gap:12px}
.marca img{width:46px;height:46px;border-radius:12px;background:#fff}
.marca b{display:block;font-weight:800;letter-spacing:.6px}
.marca small{display:block;font-size:10px;letter-spacing:1.6px;color:var(--muted);text-transform:uppercase}
.saud{margin:24px 0 18px}
.saud .dia{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.saud .dia .pt{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(34,176,125,.6);animation:pisca 2s infinite}
@keyframes pisca{70%{box-shadow:0 0 0 8px rgba(34,176,125,0)}100%{box-shadow:0 0 0 0 rgba(34,176,125,0)}}
.saud h1{font-size:25px;line-height:1.15;margin:6px 0 0;font-weight:800;letter-spacing:-.4px}
.msg-dia{margin-top:14px;padding:12px 14px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--marca) 16%,transparent),rgba(255,255,255,.02));border:1px solid color-mix(in srgb,var(--marca) 30%,transparent);font-size:13px;color:#eee;display:flex;gap:10px;align-items:flex-start;min-height:46px}
.msg-dia .emo{font-size:20px;line-height:1;animation:balanca 2.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes balanca{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg)}40%{transform:rotate(10deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(0)}}
.campo{margin-bottom:14px;position:relative}
.campo .in{position:relative}
.campo .in>svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px}
.campo .in input{padding-left:38px;padding-right:42px;height:46px;border-radius:11px}
.campo .olho{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:6px}
.lembrar{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);margin:4px 0 18px;text-transform:none;letter-spacing:0;font-weight:500}
.lembrar input{width:17px;height:17px;accent-color:var(--marca)}
.entrar{width:100%;height:48px;border-radius:11px;font-size:14px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.erro{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--crit) 13%,transparent);border:1px solid color-mix(in srgb,var(--crit) 40%,transparent);color:#ffd5d5;padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;animation:treme .4s}
@keyframes treme{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.demo-tip{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center}
.demo-tip button{background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;margin:3px 2px;font-size:11.5px;color:var(--ink-2)}
.demo-tip button:hover{color:var(--ink);border-color:var(--border-2)}

/* ---------------- boas-vindas ---------------- */
#bemvindo{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;text-align:center;padding:20px;transition:opacity .5s,visibility .5s}
#bemvindo.fora{opacity:0;visibility:hidden}
#bemvindo .oi{font-size:46px;animation:aceno 1.2s ease 2}
@keyframes aceno{0%,100%{transform:rotate(0)}25%{transform:rotate(18deg)}50%{transform:rotate(-8deg)}75%{transform:rotate(14deg)}}
#bemvindo h2{font-size:30px;margin:10px 0 6px;font-weight:800;letter-spacing:-.5px;animation:sobe .6s ease both .1s}
#bemvindo p{color:var(--ink-2);max-width:460px;margin:0 auto;animation:sobe .6s ease both .25s}
#bemvindo .setor{display:inline-block;margin-top:16px;padding:5px 12px;border-radius:20px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;animation:sobe .6s ease both .4s}

/* ---------------- app ---------------- */
#app{min-height:100vh;display:grid;grid-template-columns:240px minmax(0,1fr)}
.lado{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg-2);border-right:1px solid var(--border);padding:16px 12px;display:flex;flex-direction:column;gap:4px}
.lado .marca{padding:4px 6px 16px}
.lado .marca img{width:38px;height:38px;border-radius:10px}
.grupo{font-size:10px;font-weight:800;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;padding:14px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:9px;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:13px;text-align:left}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav .bd{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;animation:pulsa 2s infinite}@keyframes pulsa{50%{box-shadow:0 0 0 5px rgba(229,72,77,.18)}}.nav.on{background:color-mix(in srgb,var(--marca) 16%,transparent);color:#fff;box-shadow:inset 3px 0 0 var(--marca)}
.lado .rodape{margin-top:auto;padding-top:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--marca),#ff7a45);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.rodape .q{min-width:0;flex:1}
.rodape .q b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rodape .q small{color:var(--muted);font-size:11px}
main{padding:22px 26px 60px;min-width:0}
.topo{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topo h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.3px}
.topo p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.topo .dir{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.faixa-demo{background:color-mix(in srgb,var(--warn) 12%,transparent);border:1px dashed color-mix(in srgb,var(--warn) 50%,transparent);color:#f5d68a;font-size:12px;padding:8px 12px;border-radius:9px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.w{grid-column:span 6;min-width:0}
.w.metade{grid-column:span 3}.w.terco{grid-column:span 2}.w.doisTercos{grid-column:span 4}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-width:0;position:relative;overflow:hidden}
.card.cor::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--wc)}
.card-h{display:flex;align-items:center;gap:8px;padding:13px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.card-t{font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase}
.card-s{font-size:11px;color:var(--muted)}
.card-h .dir{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-b{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center;animation:sobe .5s ease both}
.kpi .k-ic{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;flex:none}
.kpi .k-l{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.kpi .k-v{font-size:24px;font-weight:800;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .k-h{font-size:11px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl{overflow:auto;max-height:440px;border:1px solid var(--border);border-radius:10px}
.vazio{padding:26px;text-align:center;color:var(--muted);font-size:12.5px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--tg) 15%,transparent);color:var(--tg);border:1px solid color-mix(in srgb,var(--tg) 35%,transparent);white-space:nowrap}
.sem{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
.hbar{margin-bottom:12px}
.hbar-h{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;margin-bottom:5px}
.hbar-tr{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.hbar-tr i{display:block;height:100%;border-radius:6px;transform-origin:left;animation:cresce .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes cresce{from{transform:scaleX(0)}}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:6px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface-3);color:var(--ink)}
.linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.toast{position:fixed;right:18px;bottom:18px;z-index:120;display:grid;gap:8px}
.toast div{background:#18181b;border:1px solid var(--border-2);border-left:3px solid var(--good);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;max-width:360px;animation:sobe .3s ease}
.toast div.mal{border-left-color:var(--crit)}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#18181b;border:1px solid var(--border-2);border-radius:10px;max-height:260px;overflow:auto;z-index:30;box-shadow:var(--shadow)}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px}
.sug button:hover,.sug button.on{background:var(--surface-3)}
.sug small{color:var(--muted)}
.carrinho li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.carrinho{list-style:none;margin:10px 0;padding:0}
.assin{position:relative;height:150px;margin:6px 0 4px;background:#fff;border:1px dashed var(--border-2);border-radius:10px;overflow:hidden}
.assin canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.assin span{position:absolute;left:14px;right:14px;bottom:26px;border-top:1px solid #ccc;pointer-events:none;font-size:11px;color:#999;padding-top:3px}
.assin-h{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.carrinho li span{flex:1;min-width:0}
.carrinho input{width:80px;text-align:right}
svg.ch{display:block;width:100%;height:auto}
svg.ch .ln{stroke-dasharray:1;stroke-dashoffset:1;animation:desenha 1.2s cubic-bezier(.3,.7,.2,1) forwards}@keyframes desenha{to{stroke-dashoffset:0}}svg.ch text{font:500 10px var(--sans);fill:var(--muted)}
.legenda{display:flex;gap:14px;margin-top:8px;font-size:11px;color:var(--ink-2)}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.recado{font-size:15px;line-height:1.55;white-space:pre-wrap}
.burger{display:none}

/* ---------------- editor ---------------- */
.ed{display:grid;grid-template-columns:370px minmax(0,1fr);gap:16px;align-items:start}
.ed-col{display:grid;gap:14px}
.tela-it{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:var(--surface-2)}
.tela-it.on{border-color:var(--marca);background:color-mix(in srgb,var(--marca) 10%,var(--surface-2))}
.tela-it input{height:32px;padding:5px 8px;background:transparent;border-color:transparent}
.tela-it input:focus{background:var(--surface)}
.ib{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.ib:hover{color:var(--ink);border-color:var(--border-2)}
.ib svg{width:15px;height:15px}
.bloco{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;background:var(--surface-2);display:grid;gap:8px}
.bloco.arrastando{opacity:.4}
.bloco.alvo{border-color:var(--accent);box-shadow:0 -3px 0 var(--accent)}
.bloco-h{display:flex;align-items:center;gap:8px}
.bloco-h .alca{cursor:grab;color:var(--muted);display:grid;place-items:center}
.bloco-h b{font-size:12.5px;flex:1;min-width:0}
.bloco-h small{color:var(--muted);font-weight:500}
.bloco-o{display:grid;grid-template-columns:1fr 120px;gap:8px}
.bloco-o input,.bloco-o select{height:32px;padding:5px 8px;font-size:12.5px}
.cores{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cores button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;background:var(--c)}
.cores button.on{border-color:#fff}
.catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.catalogo button{text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;font-size:12.5px}
.catalogo button:hover{border-color:var(--accent)}
.catalogo button b{display:block;margin-bottom:3px}
.catalogo button small{color:var(--muted)}
.previa{border:1px dashed var(--border-2);border-radius:var(--r);padding:14px;background:var(--bg)}
.previa-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.salvar-barra{position:sticky;bottom:12px;z-index:20;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:10px 12px;border-radius:12px;background:rgba(24,24,27,.92);border:1px solid var(--border-2);box-shadow:var(--shadow);margin-top:14px}
.salvar-barra span{margin-right:auto;font-size:12.5px;color:var(--ink-2)}
.chk{display:flex;align-items:center;gap:8px;font-size:12.5px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink-2);margin:0}
.chk input{width:16px;height:16px;accent-color:var(--marca)}

@media (max-width:1000px){.w.metade,.w.terco,.w.doisTercos{grid-column:span 6}.ed{grid-template-columns:1fr}}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  .lado{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow)}
  .lado.aberto{transform:none}
  .burger{display:inline-flex}
  main{padding:16px 16px 60px}
  .card-login{padding:22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

function aplicarMarca(){

  $$('[data-sub-sistema]').forEach(e=>e.textContent=m.sub||'');

}
function abertura(depois){
  const cache=store.get('layout_cache');if(cache)LAYOUT=mesclar(cache);aplicarMarca();

/* ---------------------------------------------------------------- preparação dos dados */
const P={};
function prep(){
  const D=DADOS||{};
  P.est=(D.estoque||[]).map(r=>({...r,q:int(r.quantidade),min:int(r.estoque_minimo)}));
  P.mov=(D.movimentacoes||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),tipo:N(r.tipo)})).filter(r=>r.d).sort((a,b)=>+b.d-+a.d||String(b.hora).localeCompare(String(a.hora)));
  P.fb=(D.fechamento_bases||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),eq:int(r.equipes),k:N(r.base)})).filter(r=>r.d);
  P.fp=(D.fechamento_producao||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),eq:int(r.equipes),k:N(r.base)})).filter(r=>r.d);
  const datas=[...P.fb,...P.fp].map(r=>+r.d);
  P.ref=datas.length?new Date(Math.max(...datas)):new Date();
  const hj=pdate((D.agora||{}).data)||new Date();hj.setHours(0,0,0,0);P.hoje=hj;
  P.bases=[...new Set([...P.fb,...P.fp].map(r=>r.k).concat((D.metas_bases||[]).map(m=>N(m.base))))].filter(Boolean).sort();
  P.equipes=[...new Set([...(D.equipes||[]).map(e=>N(e.codigo)),...Object.keys(D.saldo_equipes||{})])].filter(Boolean).sort();
  P.saldo=D.saldo_equipes||{};
  P.func=(D.funcionarios||[]).map(f=>({...f,mat:N(f.matricula)})).sort((a,b)=>String(a.nome).localeCompare(b.nome));
  P.epiCad=Object.fromEntries((D.epi_cadastro||[]).map(x=>[N(x.codigo),x]));
  P.ent=(D.entregas_funcionario||[]).map(e=>({...e,d:pdate(e.data),v:pdate(e.vencimento),vca:pdate(e.validade_ca),q:int(e.quantidade),st:N(e.status)||'EM USO'}));
  P.inv=(D.inventarios||[]);
  P.mont=(D.producao_montagem||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),m:String(r.montador||'').trim().toUpperCase()})).filter(r=>r.d);
  P.montadores=[...new Set([...P.func.filter(f=>/MONTA/.test(N(f.funcao))&&N(f.situacao)!=='INATIVO').map(f=>f.nome),...P.mont.map(r=>r.m)])].filter(Boolean).sort();
}
const reais=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const reaisC=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const flo=v=>{const t=String(v??'').replace(/[R$\s]/g,'');if(!t)return 0;const n=t.includes(',')?parseFloat(t.replace(/\./g,'').replace(',','.')):parseFloat(t);return isNaN(n)?0:n};
const diasAte=d=>d?Math.round((d-P.hoje)/864e5):null;
const statusVenc=d=>{const x=diasAte(d);if(x==null)return{t:'sem data',c:'var(--muted)',k:0};if(x<0)return{t:'vencido há '+(-x)+'d',c:'var(--crit)',k:2};if(x<=(CFG().dias_aviso||30))return{t:'vence em '+x+'d',c:'var(--warn)',k:1};return{t:'ok · '+fdate(d),c:'var(--good)',k:0}};
const emFalta=()=>P.est.filter(i=>i.min&&i.q<i.min);
const entAtivas=()=>P.ent.filter(e=>e.st==='EM USO');
const alertasSST=()=>entAtivas().filter(e=>statusVenc(e.v).k>0).length+Object.values(P.epiCad).filter(c=>statusVenc(pdate(c.validade_ca)).k>0).length;
function ehUtil(d){const w=d.getDay();return w>=1&&w<=5||(w===6&&!!CFG().sabado)}
function diasUteis(y,m,ate){const fim=ate==null?new Date(y,m+1,0).getDate():ate;let n=0;for(let d=1;d<=fim;d++)if(ehUtil(new Date(y,m,d)))n++;return n}
function metaDia(montadoresNoDia){const c=CFG();return c.meta_por==='setor'?int(c.meta):int(c.meta)*Math.max(1,montadoresNoDia)}

function abrir(id){
  TELA=id;store.set('ultima_tela',id);montarNav();window.scrollTo(0,0);
  const main=$('#main');
  if(id==='m_geral')return renderGeral(main);

  const [setor,tid]=id.split('::');const t=telasDo(setor).find(x=>x.id===tid)||telasDo(setor)[0];
  if(!t){main.innerHTML='<div class="vazio">Nenhuma tela configurada para este setor.</div>';return}
  renderTela(main,setor,t);
}

const kpi=(ic,cor,l,v,h)=>`<div class="kpi"><div class="k-ic" style="background:color-mix(in srgb,${cor} 16%,transparent);color:${cor}">${ico(ic)}</div><div><div class="k-l">${esc(l)}</div><div class="k-v">${v}</div>${h?`<div class="k-h">${h}</div>`:''}</div></div>`;
const tag=(t,c)=>`<span class="tag" style="--tg:${c}">${esc(t)}</span>`;
const TIPO_COR={ENTRADA:'var(--s3)',ENTREGA:'var(--s1)',USO:'var(--s2)',DEVOLUCAO:'var(--s6)',SAIDA:'var(--s1)',AJUSTE:'var(--s4)'};

function hbars(rows,fmt){const mx=Math.max(1,...rows.map(r=>r.v));return rows.map((r,i)=>`<div class="hbar"><div class="hbar-h"><span>${esc(r.l)}</span><span>${fmt(r.v)}</span></div><div class="hbar-tr"><i style="width:${Math.max(.6,r.v/mx*100)}%;background:${r.c||'var(--s1)'};animation-delay:${i*.04}s"></i></div></div>`).join('')}
function linha(series,labels,fmt){
  const Wd=1000,H=240,ml=42,mr=12,mt=10,mb=24;const mx=Math.max(1,...series.flatMap(s=>s.v));
  const st=(()=>{const raw=mx/4;const p=Math.pow(10,Math.floor(Math.log10(raw||1)));const f=raw/p;return(f<=1?1:f<=2?2:f<=5?5:10)*p})();const top=st*Math.ceil(mx/st);
  const X=k=>ml+(Wd-ml-mr)*k/Math.max(1,labels.length-1),Y=v=>mt+(H-mt-mb)*(1-v/top);
  let g='';for(let v=0;v<=top+1e-9;v+=st)g+=`<line x1="${ml}" x2="${Wd-mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="rgba(255,255,255,.06)"/><text x="${ml-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`;
  const passo=Math.ceil(labels.length/8);labels.forEach((l,k)=>{if(k%passo===0||k===labels.length-1)g+=`<text x="${X(k)}" y="${H-6}" text-anchor="middle">${esc(l)}</text>`});
  series.forEach(s=>{const d=s.v.map((v,k)=>(k?'L':'M')+X(k).toFixed(1)+','+Y(v).toFixed(1)).join('');
    if(s.meta){g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="1.6" stroke-dasharray="6 5" opacity=".9"/>`;return}
    g+=`<path d="${d}L${X(labels.length-1)},${Y(0)}L${X(0)},${Y(0)}Z" fill="${s.c}" opacity=".1"/><path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" pathLength="1" class="ln"/>`;
    s.v.forEach((v,k)=>g+=`<circle cx="${X(k)}" cy="${Y(v)}" r="7" fill="transparent"><title>${esc(labels[k])} · ${esc(s.n)}: ${fmt(v)}</title></circle>`)});
  return `<svg class="ch" viewBox="0 0 ${Wd} ${H}">${g}</svg><div class="legenda">${series.map(s=>`<span><i style="background:${s.c}${s.meta?';height:2px;vertical-align:3px':''}"></i>${esc(s.n)}</span>`).join('')}</div>`;
}

  inventario:{nome:'Inventário (contagem)',setores:['almoxarifado'],desc:'Contar o estoque físico e ajustar o sistema para o que foi contado',render(el,w){
    const K='inv_rascunho';let cont=store.get(K)||{};let cat='',prat='',busca='',soDif=false;
    const cats=[...new Set(P.est.map(i=>i.categoria).filter(Boolean))].sort(),prats=[...new Set(P.est.map(i=>i.prateleira).filter(Boolean))].sort();
    el.innerHTML=cardH(w,CAT.inventario,`<div class="linha"><input placeholder="Buscar material ou código…" data-b><select data-c><option value="">Todas as categorias</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><select data-p><option value="">Todas as prateleiras</option>${prats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><label class="chk" style="align-self:center"><input type="checkbox" data-sd> só divergentes</label></div>
      <div data-res style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"></div>
      <div class="tbl" style="max-height:560px"><table><thead><tr><th>Material</th><th>Local</th><th class="num">No sistema</th><th class="num" style="width:120px">Contado</th><th class="num">Diferença</th><th class="num">Valor dif.</th></tr></thead><tbody data-t></tbody></table></div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px"><input data-obs placeholder="Observação do inventário (opcional)" style="flex:1;min-width:200px"><button class="btn" data-zerar>Limpar contagem</button><button class="btn" data-igual title="Marca os itens visíveis como contados iguais ao sistema">Visíveis = sistema</button><button class="btn pri" data-ok>Gravar inventário</button></div>`,null,'a contagem fica salva neste aparelho até gravar');
    const S=q=>$(q,el);
    const lista=()=>P.est.filter(i=>(!cat||i.categoria===cat)&&(!prat||i.prateleira===prat)&&(!busca||N(i.material+' '+i.codigo).includes(busca))&&(!soDif||(cont[i.codigo]!=null&&int(cont[i.codigo])!==i.q)));
    const resumo=()=>{const ks=Object.keys(cont).filter(k=>String(cont[k])!=='');let div=0,val=0;ks.forEach(k=>{const i=P.est.find(x=>x.codigo===k);if(!i)return;const d=int(cont[k])-i.q;if(d){div++;val+=d*flo(i.valor_unitario)}});
      S('[data-res]').innerHTML=tag(ks.length+' de '+P.est.length+' contados','var(--s1)')+(div?tag(div+' divergente(s)','var(--warn)'):'')+(val?tag('diferença '+reaisC(val),val<0?'var(--crit)':'var(--good)'):'');S('[data-ok]').disabled=!ks.length};
    const linhaHtml=i=>{const c=cont[i.codigo];const has=c!=null&&String(c)!=='';const d=has?int(c)-i.q:0;const v=d*flo(i.valor_unitario);
      return `<tr data-cod="${esc(i.codigo)}"><td><b>${esc(i.material)}</b><div style="font-size:11px;color:var(--muted)">${esc(i.codigo)} · ${esc(i.categoria)}</div></td><td>${esc([i.prateleira,i.posicao].filter(Boolean).join('-')||'—')}</td><td class="num">${num(i.q)} ${esc(i.unidade)}</td><td class="num"><input type="number" min="0" inputmode="numeric" value="${has?esc(c):''}" data-in style="height:34px;text-align:right"></td><td class="num" data-d>${has?(d?tag((d>0?'+':'')+num(d),d>0?'var(--good)':'var(--crit)'):tag('ok','var(--muted)')):'—'}</td><td class="num" data-v>${has&&d&&flo(i.valor_unitario)?reaisC(v):'—'}</td></tr>`};
    const draw=()=>{const l=lista();S('[data-t]').innerHTML=l.map(linhaHtml).join('')||'<tr><td colspan="6" class="vazio">Nada para mostrar.</td></tr>';
      $$('[data-in]',el).forEach(inp=>{inp.oninput=()=>{const cod=inp.closest('tr').dataset.cod;if(inp.value==='')delete cont[cod];else cont[cod]=inp.value;store.set(K,cont);const i=P.est.find(x=>x.codigo===cod);const d=int(inp.value)-i.q;const tr=inp.closest('tr');
          $('[data-d]',tr).innerHTML=inp.value===''?'—':(d?tag((d>0?'+':'')+num(d),d>0?'var(--good)':'var(--crit)'):tag('ok','var(--muted)'));$('[data-v]',tr).textContent=inp.value!==''&&d&&flo(i.valor_unitario)?reaisC(d*flo(i.valor_unitario)):'—';resumo()};
        inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const all=$$('[data-in]',el);const n=all[all.indexOf(inp)+1];n&&n.focus()}}});resumo()};
    S('[data-b]').oninput=e=>{busca=N(e.target.value);draw()};S('[data-c]').onchange=e=>{cat=e.target.value;draw()};S('[data-p]').onchange=e=>{prat=e.target.value;draw()};S('[data-sd]').onchange=e=>{soDif=e.target.checked;draw()};
    S('[data-zerar]').onclick=()=>{if(!confirm('Apagar toda a contagem feita neste aparelho?'))return;cont={};store.del(K);draw()};
    S('[data-igual]').onclick=()=>{lista().forEach(i=>{if(cont[i.codigo]==null||cont[i.codigo]==='')cont[i.codigo]=String(i.q)});store.set(K,cont);draw()};
    S('[data-ok]').onclick=async()=>{const itens=Object.entries(cont).filter(([k,v])=>String(v)!=='').map(([codigo,contado])=>({codigo,contado}));
      const div=itens.filter(x=>{const i=P.est.find(y=>y.codigo===x.codigo);return i&&int(x.contado)!==i.q}).length;
      if(!confirm(`Gravar inventário?\n\n${itens.length} item(ns) contado(s), ${div} com diferença.\nO estoque desses itens passa a ser o valor contado.`))return;
      const b=S('[data-ok]');b.disabled=true;b.textContent='Gravando…';
      try{const r=await api('inventario',{itens,observacao:S('[data-obs]').value});store.del(K);toast('✅ Inventário gravado: '+r.contados+' contados, '+r.ajustados+' ajustados'+(r.valor_diferenca?' ('+reaisC(r.valor_diferenca)+')':'')+'.');await carregarDados();abrir(TELA)}
      catch(err){toast(err.message,true);b.disabled=false;b.textContent='Gravar inventário'}};
    draw()}},

  meu_mes:{nome:'Meu mês (montador)',setores:['montagem'],desc:'Produção do montador: hoje, mês, meta do mês e quanto falta',render(el,w){

      const mes=P.mont.filter(r=>r.m===quem&&mkey(r.d)===mk),feito=mes.reduce((t,r)=>t+r.q,0),hoje=mes.filter(r=>dkey(r.d)===dkey(hj)).reduce((t,r)=>t+r.q,0);

function ligarEditor(main,telas,t){
  $$('[data-es]',main).forEach(b=>b.onclick=()=>{ED_SETOR=b.dataset.es;ED_TELA=0;renderEditor(main)});
  $$('[data-ti]',main).forEach(d=>d.onclick=e=>{if(e.target.closest('input,select,button'))return;ED_TELA=+d.dataset.ti;renderEditor(main)});
  $$('[data-tn]',main).forEach(i=>{i.onfocus=()=>{if(ED_TELA!==+i.dataset.tn){ED_TELA=+i.dataset.tn;renderEditor(main);setTimeout(()=>{const x=$(`[data-tn="${ED_TELA}"]`);x&&x.focus()},0)}};i.oninput=()=>{telas[i.dataset.tn].nome=i.value;sujou(main,false)};i.onchange=()=>renderEditor(main)});
  $$('[data-tic]',main).forEach(s=>s.onchange=()=>{telas[s.dataset.tic].icone=s.value;sujou(main)});
  const mv=(a,i,d)=>{const j=i+d;if(j<0||j>=a.length)return false;[a[i],a[j]]=[a[j],a[i]];return true};
  $$('[data-tu]',main).forEach(b=>b.onclick=()=>{if(mv(telas,+b.dataset.tu,-1)){ED_TELA=+b.dataset.tu-1;sujou(main)}});
  $$('[data-td]',main).forEach(b=>b.onclick=()=>{if(mv(telas,+b.dataset.td,1)){ED_TELA=+b.dataset.td+1;sujou(main)}});
  $$('[data-tx]',main).forEach(b=>b.onclick=()=>{if(telas.length<=1)return toast('O setor precisa de pelo menos uma tela.',true);if(!confirmar('Excluir a tela “'+telas[b.dataset.tx].nome+'”?'))return;telas.splice(+b.dataset.tx,1);ED_TELA=0;sujou(main)});
  $('[data-addtela]',main).onclick=()=>{telas.push({id:'t'+Date.now().toString(36),nome:'Nova tela',icone:'star',widgets:[]});ED_TELA=telas.length-1;sujou(main)};
  if(t){
    const ws=t.widgets;
    $$('[data-add]',main).forEach(b=>b.onclick=()=>{ws.push(W(b.dataset.add));sujou(main);toast('Bloco adicionado no fim da tela.')});
    $$('[data-bu]',main).forEach(b=>b.onclick=()=>{if(mv(ws,+b.dataset.bu,-1))sujou(main)});
    $$('[data-bd]',main).forEach(b=>b.onclick=()=>{if(mv(ws,+b.dataset.bd,1))sujou(main)});
    $$('[data-bx]',main).forEach(b=>b.onclick=()=>{ws.splice(+b.dataset.bx,1);sujou(main)});
    $$('[data-bv]',main).forEach(c=>c.onchange=()=>{ws[c.dataset.bv].visivel=c.checked;sujou(main)});
    $$('[data-bt]',main).forEach(i=>{i.oninput=()=>{ws[i.dataset.bt].titulo=i.value;sujou(main,false)};i.onchange=()=>renderEditor(main)});
    $$('[data-btx]',main).forEach(i=>{i.oninput=()=>{ws[i.dataset.btx].texto=i.value;sujou(main,false)};i.onchange=()=>renderEditor(main)});
    $$('[data-bl]',main).forEach(s=>s.onchange=()=>{ws[s.dataset.bl].largura=s.value;sujou(main)});
    $$('[data-bc]',main).forEach(b=>b.onclick=()=>{ws[b.dataset.bc].cor=b.dataset.cor;sujou(main)});
    let de=null;
    $$('.bloco',main).forEach(bl=>{
      bl.ondragstart=e=>{if(e.target.closest('input,select,textarea')){e.preventDefault();return}de=+bl.dataset.bi;bl.classList.add('arrastando');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(de))}catch(x){}};
      bl.ondragend=()=>{bl.classList.remove('arrastando');$$('.bloco.alvo',main).forEach(x=>x.classList.remove('alvo'))};
      bl.ondragover=e=>{e.preventDefault();$$('.bloco.alvo',main).forEach(x=>x.classList.remove('alvo'));bl.classList.add('alvo')};
      bl.ondrop=e=>{e.preventDefault();const para=+bl.dataset.bi;if(de==null||de===para)return;const [x]=ws.splice(de,1);ws.splice(para,0,x);de=null;sujou(main)};
    });
  }
  ligarSalvar(main);
}

/* ---------------------------------------------------------------- assinatura na tela */
function padAssinatura(cv){
  const ctx=cv.getContext('2d');let des=false,tem=false,ult=null;
  const ajusta=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle='#111';tem=false};
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  requestAnimationFrame(ajusta);
  cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();if(!tem&&Math.abs(cv.width-r.width*(window.devicePixelRatio||1))>2)ajusta();des=true;ult=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}ctx.beginPath();ctx.arc(ult.x,ult.y,1.2,0,7);ctx.fill();tem=true;e.preventDefault()};
  cv.onpointermove=e=>{if(!des)return;const q=pt(e);ctx.beginPath();ctx.moveTo(ult.x,ult.y);ctx.lineTo(q.x,q.y);ctx.stroke();ult=q};
  cv.onpointerup=cv.onpointercancel=cv.onpointerleave=()=>{des=false};
  return{limpar:ajusta,vazia:()=>!tem,imagem(){const W=480,k=W/cv.width,c=document.createElement('canvas');c.width=W;c.height=Math.max(1,Math.round(cv.height*k));const x=c.getContext('2d');x.drawImage(cv,0,0,c.width,c.height);let u=c.toDataURL('image/png');
    if(u.length>45000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.6)}return u}};
}

/* ---------------------------------------------------------------- ficha de EPI (imprimir / PDF) */
async function fichaEPI(mat){
  const w=window.open('','_blank');
  if(!w){toast('O navegador bloqueou a janela da ficha. Libere pop-ups para este site.',true);return}
  w.document.write('<p style="font:14px Arial,sans-serif;padding:24px">Gerando a ficha de EPI…</p>');
  try{const r=await api('ficha_epi',{matricula:mat});w.document.open();w.document.write(htmlFicha(r));w.document.close()}
  catch(err){w.close();toast(err.message,true)}
}

  const linhas=l.map(e=>`<tr><td>${esc(e.data)}</td><td class="n">${esc(e.quantidade)}</td><td><b>${esc(e.material)}</b><br><small>${esc(e.codigo_material)} · ${esc(e.categoria||'')}</small></td><td>${esc(e.ca||'—')}</td><td>${esc(e.vencimento||'—')}</td><td>${sit(e)}</td><td>${esc(e.responsavel||'')}</td><td class="ass">${e.assinatura_id&&r.assinaturas[e.assinatura_id]?`<img src="${r.assinaturas[e.assinatura_id]}" alt="assinatura">`:'<small>sem assinatura digital</small>'}</td></tr>`).join('');
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Ficha de EPI - ${esc(f.nome)}</title><style>
@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}

.barra{display:flex;gap:10px;align-items:center;margin-bottom:14px;padding:10px;background:#f4f4f4;border-radius:8px}
.barra button{font:600 13px Arial;padding:8px 14px;border:0;border-radius:6px;background:${cor};color:#fff;cursor:pointer}
.top{display:flex;align-items:center;gap:14px;border-bottom:3px solid ${cor};padding-bottom:10px}
.top img{height:52px;border-radius:8px}.top h1{font-size:16px;margin:0}.top p{margin:2px 0 0;color:#555}
.dados{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px;margin:12px 0}.dados b{display:inline-block;min-width:74px;color:#555;font-weight:600}
.termo{border:1px solid #999;padding:8px 10px;text-align:justify;font-size:10.5px}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:middle}
th{background:#eee;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}td.n{text-align:right}td small{color:#666}
td.ass{width:170px;text-align:center}td.ass img{height:46px;max-width:170px}
.fim{display:flex;gap:50px;margin-top:46px}.fim div{flex:1;border-top:1px solid #111;text-align:center;padding-top:4px}
.rod{margin-top:16px;color:#777;font-size:9.5px}tr{page-break-inside:avoid}@media print{.barra{display:none}body{padding:0}}
</style></head><body>
<div class="barra"><button onclick="print()">Imprimir / Salvar em PDF</button><span>Na janela que abrir, escolha <b>Salvar como PDF</b> como destino.</span></div>
<div class="top">${logo?`<img src="${logo}" alt="">`:''}<div><h1>FICHA DE CONTROLE DE ENTREGA DE EPI, EPC E FERRAMENTAS</h1><p>${esc(r.empresa)} · NR-6 (Equipamento de Proteção Individual)</p></div></div>
<div class="dados"><div><b>Funcionário</b> ${esc(f.nome)}</div><div><b>Matrícula</b> ${esc(f.matricula)}</div><div><b>Função</b> ${esc(f.funcao||'—')}</div><div><b>Equipe</b> ${esc(f.equipe||'—')}</div><div><b>Base</b> ${esc(f.base||'—')}</div><div><b>Admissão</b> ${esc(f.admissao||'—')}</div></div>
<div class="termo">Declaro que recebi de <b>${esc(r.empresa)}</b>, gratuitamente, os equipamentos relacionados abaixo, novos ou em perfeito estado, e que fui orientado(a) sobre o uso correto, a guarda e a conservação de cada um, conforme a NR-6. Comprometo-me a usá-los apenas para a finalidade a que se destinam, a comunicar qualquer dano ou alteração que os torne impróprios para uso e a devolvê-los quando solicitado ou no meu desligamento. Estou ciente de que a recusa injustificada em usar o EPI fornecido constitui ato faltoso (CLT, art. 158).</div>

    <div class="linha"><div><label>${u.usuario?'Nova senha (deixe vazio para manter)':'Senha'}</label><input name="senha" type="text" autocomplete="off" ${u.usuario?'':'required'}></div><div style="align-self:end"><label class="chk"><input type="checkbox" name="ativo" ${u.ativo==='NAO'?'':'checked'}> Acesso ativo</label></div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">${u.usuario?'<button type="button" class="btn" data-novo>Cancelar</button>':''}<button class="btn pri">Salvar acesso</button></div></form></div></section>`;
  const desenha=(u)=>{
    main.innerHTML=topo('Acessos','Quem entra no sistema e em qual setor. Cada pessoa só vê as telas do próprio setor.')+`<div class="grid"><div class="w doisTercos"><section class="card"><div class="card-h"><span class="card-t">Pessoas com acesso</span><span class="card-s">${lista.length}</span></div><div class="card-b"><div class="tbl"><table><thead><tr><th>Usuário</th><th>Nome</th><th>Setor</th><th>Base</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>${lista.map((x,i)=>`<tr><td><b>${esc(x.usuario)}</b></td><td>${esc(x.nome)}</td><td>${tag(SETOR_NOME[x.setor]||x.setor,SETOR_COR[x.setor]||'var(--muted)')}</td><td>${esc(x.base||'—')}</td><td>${x.ativo==='NAO'?tag('bloqueado','var(--crit)'):tag('ativo','var(--good)')}</td><td>${esc(x.ultimo_acesso||'—')}</td><td><button class="btn sm" data-ed="${i}">Editar</button></td></tr>`).join('')}</tbody></table></div></div></section></div><div class="w terco">${form(u)}</div></div>`;
    const f=$('[data-f]',main);
    $$('[data-ed]',main).forEach(b=>b.onclick=()=>desenha(lista[b.dataset.ed]));const nv=$('[data-novo]',main);if(nv)nv.onclick=()=>desenha();
    f.onsubmit=async e=>{e.preventDefault();const d={usuario:f.usuario.value.trim().toLowerCase(),nome:f.nome.value.trim(),setor:f.setor.value,base:f.base.value,senha:f.senha.value,ativo:f.ativo.checked};
      try{await api('usuario_salvar',{dados:d});toast('✅ Acesso salvo: '+d.usuario);lista=(await api('usuarios')).usuarios;desenha()}catch(err){toast(err.message,true)}};
